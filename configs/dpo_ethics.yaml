# RTX 4070 8 GB — DPO with preferences synthesized from ETHICS train.
# For each ETHICS train example we set chosen=gold, rejected=opposite. The
# resulting distribution exactly matches the test template, removing the
# PKU→ETHICS domain gap. ETHICS *test* remains untouched, per project rules.
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  source: "ethics_train"
  ethics_categories:
    - commonsense
    - deontology
    - justice
    - virtue
  n_per_category: 250           # 4 * 250 = 1000 pairs total, balanced (1h target)
  max_prompt_length: 256
  max_length: 384

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  label_smoothing: 0.0

training:
  output_dir: "./checkpoints/dpo_ethics"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5          # bumped from 5e-6: 125 steps too short to learn at low LR
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.0
  optim: "paged_adamw_8bit"
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 2
  report_to: "none"
  seed: 42

ethics:
  categories:
    - commonsense
    - deontology
    - justice
    - virtue
  samples_per_category: 100
  seed: 42
