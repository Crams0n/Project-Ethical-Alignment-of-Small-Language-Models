# Max-effort config — pushes capacity and data beyond v2 (which gave +6 pp).
#
# Changes vs dpo_ethics.yaml (v2):
#   - LoRA r 8 -> 16, alpha 16 -> 32, targets += {gate,up,down}_proj
#     (~6x trainable params; better chance of learning distinct per-category
#      Yes/No calibrations)
#   - n_per_category 250 -> 1000 (4000 pairs total, 4x data)
#   - DPO beta 0.1 -> 0.05 (allow more drift since signal is in-distribution)
#   - save_steps 100 -> 50 (frequent checkpoints to fall back to if RTX VRAM
#     starts paging again past ~step 300)
#   - max_length 384 -> 320 (frees activation VRAM headroom)
#   - logging_steps 10 -> 25 (less log spam over a longer run)
#
# Same as v2: LR=2e-5, grad_accum=8, bf16, paged_adamw_8bit, gradient checkpointing.
# Expected wall-time on RTX 4070 Laptop: ~2-3h for 500 optim steps + eval.

model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  source: "ethics_train"
  ethics_categories:
    - commonsense
    - deontology
    - justice
    - virtue
  n_per_category: 1000          # 4 * 1000 = 4000 pairs total, balanced
  max_prompt_length: 256
  max_length: 320

dpo:
  beta: 0.05                     # was 0.1; less constrained drift in-distribution
  loss_type: "sigmoid"
  label_smoothing: 0.0

training:
  output_dir: "./checkpoints/dpo_ethics_max"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.0
  optim: "paged_adamw_8bit"
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 25
  save_steps: 50
  eval_steps: 50
  save_total_limit: 5            # keep last 5 saves so we can pick best later
  report_to: "none"
  seed: 42

ethics:
  categories:
    - commonsense
    - deontology
    - justice
    - virtue
  samples_per_category: 100
  seed: 42
