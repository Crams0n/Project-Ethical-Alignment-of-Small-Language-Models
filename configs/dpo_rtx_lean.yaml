# RTX 4070 Laptop 8 GB — VRAM-optimized config.
# The default dpo.yaml saturated VRAM at 96% and dropped iter speed from
# 10 s/it to 160 s/it as CUDA started swapping. This config:
#   - cuts max_length 1024 -> 512 (halves activation memory)
#   - cuts max_prompt_length 512 -> 384
#   - cuts LoRA rank 16 -> 8 (smaller adapters + optim state)
#   - cuts max_train_samples 20000 -> 8000 (faster, still plenty for DPO)
#   - increases grad_accumulation 8 -> 16 to keep effective batch = 16
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  dataset_name: "PKU-Alignment/PKU-SafeRLHF"
  config_name: null
  train_split: "train"
  eval_split: "test"
  max_train_samples: 8000
  max_eval_samples: 500
  max_prompt_length: 384
  max_length: 512
  filter_safety_disagreement: true

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  label_smoothing: 0.0

training:
  output_dir: "./checkpoints/dpo_rtx"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.0
  optim: "paged_adamw_8bit"
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 1
  report_to: "none"
  seed: 42

ethics:
  categories:
    - commonsense
    - deontology
    - justice
    - virtue
  samples_per_category: 100
  seed: 42
