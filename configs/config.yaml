# Central hyperparameter file for the RLHF pipeline.
# Loaded by every notebook so a single change here propagates everywhere.

base_model: "Qwen/Qwen2.5-1.5B-Instruct"

paths:
  reward_model_dir: "outputs/reward_model"
  rloo_policy_dir:  "outputs/rloo_policy"
  eval_dir:         "outputs/eval"

seed: 42

# Shared LoRA configuration (reward model + RL policy).
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  bias: "none"

# QLoRA 4-bit quantization.
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

# === Reward model ============================================================
reward_model:
  dataset_name: "Anthropic/hh-rlhf"
  num_train_samples: 3000
  num_eval_samples: 300
  max_length: 512
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  num_train_epochs: 1
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 50
  save_steps: 100

# === RLOO (Reinforce Leave-One-Out) ==========================================
# RLOO replaces PPO here because TRL 1.x dropped PPOTrainer. RLOO uses K samples
# per prompt and the average reward over the other K-1 as the baseline — no value
# head, no GAE. The project brief explicitly authorises "lighter alternatives to PPO".
rloo:
  prompt_dataset: "Anthropic/hh-rlhf"
  num_prompts: 500
  max_prompt_length: 256
  max_completion_length: 64
  num_generations: 4
  learning_rate: 1.0e-6
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  num_train_epochs: 1
  beta: 0.04
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  warmup_ratio: 0.03
  logging_steps: 5
  save_steps: 50

# === Evaluation ==============================================================
evaluation:
  ethics_subsets:
    - commonsense
    - justice
    - deontology
    - virtue
    - utilitarianism
  samples_per_subset: 50
  # Models to compare side-by-side.
  models:
    baseline:
      adapter_path: null              # plain base model
    rlhf:
      adapter_path: "outputs/rloo_policy"
