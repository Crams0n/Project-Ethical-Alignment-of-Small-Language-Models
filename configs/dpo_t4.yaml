# Config tuned for Google Colab free tier (NVIDIA T4 16 GB).
# T4 = Turing arch → NO native bfloat16. Use float16 everywhere.
# Otherwise identical to configs/dpo.yaml.
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"      # was bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  dataset_name: "PKU-Alignment/PKU-SafeRLHF"
  config_name: null
  train_split: "train"
  eval_split: "test"
  max_train_samples: 20000
  max_eval_samples: 1000
  max_prompt_length: 512
  max_length: 1024
  filter_safety_disagreement: true

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  label_smoothing: 0.0

training:
  output_dir: "./checkpoints/dpo_t4"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.0
  optim: "paged_adamw_8bit"
  max_grad_norm: 1.0
  # AMP disabled: bnb_4bit_compute_dtype=float16 already handles mixed-precision
  # for the frozen base. Enabling fp16 in TrainingArguments wraps the optimizer
  # in a GradScaler that errors out with "BFloat16 not implemented for
  # _amp_foreach_non_finite_check_and_unscale_cuda" on this stack (transformers
  # 5.x + accelerate + bnb on T4). Running fp32 training of the tiny LoRA
  # adapters costs ~zero throughput because the heavy matmul stays in bnb fp16.
  bf16: false
  fp16: false
  gradient_checkpointing: true
  logging_steps: 25
  save_steps: 500
  eval_steps: 250
  save_total_limit: 2
  report_to: "none"
  seed: 42

ethics:
  categories:
    - commonsense
    - deontology
    - justice
    - virtue
  samples_per_category: 100
  seed: 42
