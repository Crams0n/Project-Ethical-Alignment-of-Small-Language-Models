# CPU smoke-test config. Uses a 0.5B model and a tiny eval set so the full
# pipeline runs in a few minutes on a laptop without a GPU. Only useful to
# check that the pipeline is wired correctly — results are not meaningful.

model:
  name: "Qwen/Qwen2.5-0.5B-Instruct"
  trust_remote_code: false
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float32"
  bnb_4bit_use_double_quant: false

corpus:
  dir: "corpus"

retrieval:
  backend: "dense"
  encoder_name: "sentence-transformers/all-MiniLM-L6-v2"
  encoder_device: "cpu"
  index_dir: "indexes/dense_minilm_cpu"

rag:
  top_k: 3
  template: "principles"

ethics:
  categories:
    - commonsense
    - justice
  samples_per_category: 20
  seed: 42
