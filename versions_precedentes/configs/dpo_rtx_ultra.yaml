# RTX 4070 Laptop 8 GB — ULTRA-lean config to fit DPO's double-forward.
# Even the lean config (max_length 512, rank 8) saturated VRAM at step ~340/500
# because DPO with PEFT runs TWO forwards per step (policy + reference). This
# config halves activation memory once more and drops the optim-state size so
# headroom remains throughout the run.
model:
  name: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 4
  alpha: 8
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  dataset_name: "PKU-Alignment/PKU-SafeRLHF"
  config_name: null
  train_split: "train"
  eval_split: "test"
  max_train_samples: 4000
  max_eval_samples: 200
  max_prompt_length: 256
  max_length: 384
  filter_safety_disagreement: true

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  label_smoothing: 0.0

training:
  output_dir: "./checkpoints/dpo_rtx_ultra"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.0
  optim: "paged_adamw_8bit"
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  save_total_limit: 2
  report_to: "none"
  seed: 42

ethics:
  categories:
    - commonsense
    - deontology
    - justice
    - virtue
  samples_per_category: 100
  seed: 42
